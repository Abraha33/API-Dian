services:
  supabase-db:
    image: postgres:15
    container_name: api-dian-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_dian
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: api-dian-redis
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    container_name: api-dian-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9000:9000'
      - '9001:9001'

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: api-dian-app
    depends_on:
      supabase-db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://postgres:postgres@supabase-db:5432/api_dian
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: docker-dev-anon
      SUPABASE_SERVICE_KEY: docker-dev-service
      JWT_SECRET: docker-dev-jwt-secret-min-16-chars
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minio
      STORAGE_SECRET_KEY: minio12345
      STORAGE_BUCKET: api-dian-docs
