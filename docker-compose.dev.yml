services:
  postgres:
    image: postgres:15
    container_name: api-dian-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_dian
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d api_dian']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - api-dian-postgres-data:/var/lib/postgresql/data

volumes:
  api-dian-postgres-data:
