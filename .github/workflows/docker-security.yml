name: Docker Security

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.production
          tags: local/api-dian:${{ github.sha }}
          load: true
          provenance: false
          sbom: false

      - name: Scan API image for fixable high and critical CVEs
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: local://local/api-dian:${{ github.sha }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          write-comment: false

      - name: Build PostgreSQL image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infra/postgres/Dockerfile
          tags: local/api-dian-postgres:${{ github.sha }}
          load: true
          provenance: false
          sbom: false

      - name: Scan PostgreSQL image for fixable high and critical CVEs
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: local://local/api-dian-postgres:${{ github.sha }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          write-comment: false
