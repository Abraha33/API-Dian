name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Refresh lock for intentional dependency change
        working-directory: apps/api
        run: npm install --package-lock-only --ignore-scripts

      - name: Install
        working-directory: apps/api
        run: npm ci

      - name: Production dependency audit
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: apps/api
        run: npm run build

      - name: Lint check
        working-directory: apps/api
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        working-directory: apps/api
        run: npm test -- --runInBand

      - name: Apply F6 migrations and structural checks
        env:
          PGPASSWORD: postgres
        run: |
          for migration in supabase/migrations/*.sql; do
            if [ -s "$migration" ]; then
              echo "Applying $migration"
              psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f "$migration"
            fi
          done
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            -f scripts/introspection/verify-f6-core.sql
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            -f scripts/introspection/verify-f6-behavior.sql
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            -f scripts/introspection/provision-f6b-ci.sql

      - name: E2E tests as non-privileged API login
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci_api:ci_api@localhost:5432/ci
          DATABASE_POOL_MAX: '3'
          AUTH_PEPPER: f6-test-pepper-0123456789abcdef-32bytes
        run: npm run test:e2e

      - name: Commit validated lockfile
        run: |
          if ! git diff --quiet -- apps/api/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/package-lock.json
            git commit -m "chore: refresh lock for pg client [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload validated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6b-lockfile
          path: apps/api/package-lock.json
          retention-days: 1
