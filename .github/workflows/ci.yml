name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Validate local compose
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate Windows bootstrap syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/dev/bootstrap-local.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install
        working-directory: apps/api
        run: npm ci

      - name: Production dependency audit
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: apps/api
        run: npm run build

      - name: Lint check
        working-directory: apps/api
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        working-directory: apps/api
        run: npm test -- --runInBand

      - name: Provider contract harness self-tests
        working-directory: apps/api
        run: timeout 30s npm run test:provider-contract-harness -- --verbose

      - name: Apply migrations and provision test identities
        env:
          PGPASSWORD: postgres
        run: |
          for migration in supabase/migrations/*.sql; do
            if [ -s "$migration" ]; then
              echo "Applying $migration"
              psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f "$migration"
            fi
          done
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            -f scripts/introspection/verify-f6-core.sql
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            -f scripts/introspection/verify-f6-behavior.sql
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            --set=api_password=ci-local-api-2026 \
            --set=worker_password=ci-local-worker-2026 \
            --set=ops_password=ci-local-ops-2026 \
            -f scripts/dev/provision-local-runtime.sql
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            -f scripts/introspection/verify-local-runtime.sql
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            -f scripts/introspection/provision-f6b-ci.sql

      - name: Kill-switch control as constrained ops login
        env:
          PGPASSWORD: ci_ops
        run: |
          psql -h localhost -U ci_ops -d ci -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE app_ops_control;
          UPDATE app.runtime_controls
          SET reason = 'CI ops control check',
              updated_at = now(),
              updated_by = session_user
          WHERE singleton_id = 1;
          COMMIT;
          SQL

      - name: Operational report as constrained ops login
        env:
          PGPASSWORD: ci_ops
        run: |
          psql -h localhost -U ci_ops -d ci -v ON_ERROR_STOP=1 \
            -f scripts/ops/fiscal-ops-report.sql

      - name: E2E tests as separated API and worker DB logins
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci_api:ci_api@localhost:5432/ci
          WORKER_DATABASE_URL: postgresql://ci_worker:ci_worker@localhost:5432/ci
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          DATABASE_POOL_MAX: '3'
          AUTH_PEPPER: f6-test-pepper-0123456789abcdef-32bytes
        run: npm run test:e2e -- --runInBand

      - name: Concurrency correctness gate
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci_api:ci_api@localhost:5432/ci
          WORKER_DATABASE_URL: postgresql://ci_worker:ci_worker@localhost:5432/ci
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          DATABASE_POOL_MAX: '3'
          AUTH_PEPPER: f6-test-pepper-0123456789abcdef-32bytes
        run: timeout 120s npm run test:concurrency -- --verbose
