name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        working-directory: apps/api
        run: npm ci

      - name: Build
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
        run: npm run build

      - name: Lint check
        working-directory: apps/api
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        working-directory: apps/api
        run: npm test -- --runInBand

      - name: E2E tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
        run: npm run test:e2e

      - name: Apply and verify F6 core SQL
        env:
          PGPASSWORD: postgres
        run: |
          for migration in supabase/migrations/*.sql; do
            if [ -s "$migration" ]; then
              echo "Applying $migration"
              psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f "$migration"
            fi
          done
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            -f scripts/introspection/verify-f6-core.sql
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 \
            -f scripts/introspection/verify-f6-behavior.sql
