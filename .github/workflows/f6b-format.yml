name: F6B format temporary

on:
  push:
    branches: [agent/f6b-worker-fake]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f6b-worker-fake
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        working-directory: apps/api
        run: npm ci
      - name: Format targeted F6B2 files
        working-directory: apps/api
        run: npx prettier --write src/modules/worker/fiscal-worker.repository.ts src/modules/worker/worker.module.ts src/worker.ts test/app.e2e-spec.ts
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/src/modules/worker/fiscal-worker.repository.ts apps/api/src/modules/worker/worker.module.ts apps/api/src/worker.ts apps/api/test/app.e2e-spec.ts
            git commit -m "style: format F6B2 worker validation [skip ci]"
            git push origin HEAD:agent/f6b-worker-fake
          fi
